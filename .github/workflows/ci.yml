name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: packages/*/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: extractions/setup-just@v4

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true

      - name: Setup
        run: just setup

      - name: Lint
        run: just lint-all

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: packages/*/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: extractions/setup-just@v4

      - name: Setup
        run: just setup

      - name: Test with coverage floor
        run: just test-all

      - name: Build
        run: just build-all

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: packages/*/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: extractions/setup-just@v4

      - name: Setup
        run: just setup

      - name: Install Chromium
        working-directory: packages/ui-web
        run: bun x playwright install --with-deps chromium

      - name: End-to-end tests
        run: just ui test-e2e
