name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: packages/*/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: extractions/setup-just@v4

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true

      - name: Setup
        run: just setup

      - name: Lint
        run: just lint-all

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: packages/*/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: extractions/setup-just@v4

      - name: Setup
        run: just setup

      - name: Test with coverage floor
        run: just test-all

      - name: Build
        run: just build-all

  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The e2e container's browsers must match @playwright/test, which
      # package.json pins to an exact version.
      - id: version
        run: |
          version="$(jq -r '.devDependencies["@playwright/test"]' packages/ui-web/package.json)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "@playwright/test must be pinned to an exact version, got '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Playwright's image ships Chromium and its system dependencies. The job
    # runs as the image's root user so it can add unzip, which setup-bun needs.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    steps:
      - name: Install unzip
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: packages/*/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: extractions/setup-just@v4

      - name: Setup
        run: just setup

      - name: End-to-end tests
        run: just ui test-e2e

      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          path: |
            .tmp/e2e-logs/
            packages/ui-web/test-results/
          if-no-files-found: ignore
